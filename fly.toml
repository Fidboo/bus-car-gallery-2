# fly.toml app configuration file generated for bus-car-gallery-2 on 2026-10-09T13:30:43+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bus-car-gallery-2'
primary_region = 'arn'

[build]

[env]
  DATA_DIR = '/var/data'

[mounts]
  source = 'gallery_data'
  destination = '/var/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
